<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Photo Description Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .toast {
            visibility: hidden;
            min-width: 250px;
            margin-left: -125px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 10;
            left: 50%;
            bottom: 30px;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-900 text-white antialiased">
    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-white">Automatic Photo Description Tool</h1>
            <p class="text-gray-400 mt-2">Capture or upload a photo to generate a product description automatically.</p>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Left Column: Input & Preview -->
            <div class="bg-gray-800 p-6 rounded-2xl shadow-lg flex flex-col gap-6">
                <!-- Settings -->
                <div>
                    <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">1. Settings</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="lotNumber" class="block text-sm font-medium text-gray-300 mb-1">Start Lot #</label>
                            <input type="number" id="lotNumber" value="1001" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="quantity" class="block text-sm font-medium text-gray-300 mb-1">Quantity</label>
                            <input type="number" id="quantity" value="1" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Capture -->
                <div id="captureContainer">
                    <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">2. Capture Image</h2>
                    <div class="bg-gray-700 rounded-lg overflow-hidden relative aspect-video flex items-center justify-center">
                        <video id="video" autoplay playsinline class="w-full h-auto hidden"></video>
                        <canvas id="canvas" class="hidden"></canvas>
                        <div id="camera-status" class="text-gray-400 p-4 text-center">
                            <p>Requesting camera access...</p>
                        </div>
                    </div>
                    <button id="snapButton" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors disabled:bg-gray-600" disabled>
                        Take Photo
                    </button>
                    <div class="relative text-center my-4">
                      <div class="absolute inset-0 flex items-center" aria-hidden="true">
                        <div class="w-full border-t border-gray-600"></div>
                      </div>
                      <div class="relative flex justify-center">
                        <span class="bg-gray-800 px-2 text-sm text-gray-400">OR</span>
                      </div>
                    </div>
                    <label for="uploadInput" class="w-full text-center block cursor-pointer bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                        Upload a Photo
                        <input type="file" id="uploadInput" accept="image/*" class="hidden">
                    </label>
                </div>

                <!-- Preview and AI -->
                <div id="previewContainer" class="hidden flex-col gap-4">
                    <h2 class="text-xl font-semibold mb-2 border-b border-gray-700 pb-2">3. Review Description</h2>
                    <img id="photoPreview" src="" alt="Captured photo" class="rounded-lg w-full h-auto">
                    <div id="descriptionContainer" class="relative">
                        <div id="loader" class="absolute inset-0 bg-gray-800 bg-opacity-80 flex items-center justify-center rounded-lg hidden">
                            <div class="loader"></div>
                        </div>
                        <textarea id="descriptionText" rows="4" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:ring-blue-500 focus:border-blue-500" placeholder="AI-generated description will appear here..."></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <button id="acceptButton" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">Accept & Add</button>
                        <button id="retryButton" class="w-full bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 px-4 rounded-lg transition-colors">Clear & Retry</button>
                    </div>
                </div>
            </div>

            <!-- Right Column: Spreadsheet -->
            <div class="bg-gray-800 p-6 rounded-2xl shadow-lg flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                    <h2 class="text-xl font-semibold">Product List</h2>
                    <button id="exportCsvButton" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition-colors">Export CSV</button>
                </div>
                <div class="flex-grow overflow-y-auto">
                    <div class="overflow-x-auto">
                        <table id="productTable" class="w-full text-sm text-left text-gray-300">
                            <thead class="text-xs text-gray-400 uppercase bg-gray-700">
                                <tr>
                                    <th scope="col" class="px-6 py-3">Lot #</th>
                                    <th scope="col" class="px-6 py-3">Description</th>
                                    <th scope="col" class="px-6 py-3">Qty</th>
                                    <th scope="col" class="px-6 py-3">Image</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Rows will be added dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div id="toast" class="toast"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snapButton = document.getElementById('snapButton');
        const uploadInput = document.getElementById('uploadInput');
        const photoPreview = document.getElementById('photoPreview');
        const descriptionText = document.getElementById('descriptionText');
        const acceptButton = document.getElementById('acceptButton');
        const retryButton = document.getElementById('retryButton');
        const lotNumberInput = document.getElementById('lotNumber');
        const quantityInput = document.getElementById('quantity');
        const productTableBody = document.querySelector('#productTable tbody');
        const exportCsvButton = document.getElementById('exportCsvButton');
        const loader = document.getElementById('loader');
        const cameraStatus = document.getElementById('camera-status');

        const captureContainer = document.getElementById('captureContainer');
        const previewContainer = document.getElementById('previewContainer');
        const toast = document.getElementById('toast');

        let currentImageData = null;
        let productData = [];

        // --- Camera and Image Handling ---

        async function setupCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                cameraStatus.innerHTML = 'Camera access is not supported by your browser. Please try uploading a photo.';
                showToast("Your browser doesn't support camera access.", "error");
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                video.classList.remove('hidden');
                cameraStatus.classList.add('hidden');
                snapButton.disabled = false;
            } catch (err) {
                console.error("Error accessing camera: ", err);
                let message = 'Could not access camera. Please upload a photo.';
                if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
                    message = 'Camera permission denied. Please check your browser settings and allow camera access for this site, then reload the page.';
                } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
                    message = 'No camera found on this device. Please try uploading a photo.';
                }
                cameraStatus.innerHTML = message;
                showToast(message);
            }
        }

        snapButton.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg');
            processImage(dataUrl);
        });

        uploadInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    processImage(e.target.result);
                };
                reader.readAsDataURL(file);
            }
        });
        
        function processImage(imageData) {
            currentImageData = imageData;
            photoPreview.src = imageData;
            switchToPreviewMode();
            generateDescription(imageData.split(',')[1]); // Send base64 part
        }

        // --- AI Description Generation ---

        async function generateDescription(base64ImageData, retries = 3, delay = 1000) {
            loader.classList.remove('hidden');
            descriptionText.value = '';
            descriptionText.placeholder = "Generating description...";

            const systemPrompt = "You are a product cataloging expert. Analyze the image and provide a concise, single-line product title followed by a brief, one or two-sentence description on a new line. Format it as: Title\nDescription.";
            const userQuery = "Generate a title and description for the product in this image.";
            const apiKey = ""; // API key is handled by the environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{
                    parts: [
                        { text: userQuery },
                        { inlineData: { mimeType: "image/jpeg", data: base64ImageData } }
                    ]
                }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorBody = await response.text();
                    throw new Error(`API request failed with status ${response.status}: ${errorBody}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    descriptionText.value = candidate.content.parts[0].text.trim();
                } else {
                    throw new Error("Invalid API response structure.");
                }
            } catch (error) {
                console.error("Error calling Gemini API:", error);
                 if (retries > 0) {
                    await new Promise(res => setTimeout(res, delay));
                    return generateDescription(base64ImageData, retries - 1, delay * 2);
                } else {
                    descriptionText.placeholder = 'Failed to generate description. Please try again.';
                    showToast('API Error. Please check console for details.');
                }
            } finally {
                loader.classList.add('hidden');
            }
        }

        // --- UI and Data Management ---

        acceptButton.addEventListener('click', () => {
            const lot = lotNumberInput.value;
            const desc = descriptionText.value;
            const qty = quantityInput.value;

            if (!lot || !desc || !qty) {
                showToast("Please ensure lot, description, and quantity are filled.");
                return;
            }

            productData.push({ lot, description: desc, quantity: qty, imageData: currentImageData });
            renderTable();
            
            lotNumberInput.value = parseInt(lot) + 1; // Increment for next item
            switchToCaptureMode();
        });

        retryButton.addEventListener('click', () => {
            switchToCaptureMode();
        });

        function switchToPreviewMode() {
            captureContainer.classList.add('hidden');
            previewContainer.classList.remove('hidden');
            previewContainer.classList.add('flex');
        }

        function switchToCaptureMode() {
            previewContainer.classList.add('hidden');
            previewContainer.classList.remove('flex');
            captureContainer.classList.remove('hidden');
            currentImageData = null;
            photoPreview.src = '';
            descriptionText.value = '';
            descriptionText.placeholder = "AI-generated description will appear here...";
            uploadInput.value = ''; // Reset file input
        }

        function renderTable() {
            productTableBody.innerHTML = '';
            productData.forEach((item) => {
                const row = document.createElement('tr');
                row.className = 'bg-gray-800 border-b border-gray-700 hover:bg-gray-600';
                
                row.innerHTML = `
                    <td class="px-6 py-4 font-medium text-white whitespace-nowrap">${item.lot}</td>
                    <td class="px-6 py-4 whitespace-pre-wrap">${item.description}</td>
                    <td class="px-6 py-4">${item.quantity}</td>
                    <td class="px-6 py-4">
                        <a href="${item.imageData}" download="${item.lot}.jpg" class="font-medium text-blue-500 hover:underline">Download</a>
                    </td>
                `;
                productTableBody.appendChild(row);
            });
        }
        
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // --- CSV Export ---

        exportCsvButton.addEventListener('click', () => {
            if (productData.length === 0) {
                showToast("No data to export.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Lot #,Description,Quantity\n";

            productData.forEach(item => {
                const description = `"${item.description.replace(/"/g, '""').replace(/\n/g, ' ')}"`;
                const row = [item.lot, description, item.quantity].join(",");
                csvContent += row + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "product_list.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // --- Initialization ---
        
        window.onload = () => {
            setupCamera();
            switchToCaptureMode();
        };

    </script>
</body>
</html>
